[project]
name = "mk-manager-v2"
version = "2.0.0"
description = "MK Manager V2 — Markdown Notes & Tasks Manager (SwordPower Web App)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
mk-manager = "mk_manager.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mk_manager"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
