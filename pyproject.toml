[project]
name = "mk-manager-v2"
version = "2.0.0"
description = "MK Manager V2 — Markdown Notes & Tasks Manager (SwordPower Web App)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
]

[project.scripts]
mk-manager = "mk_manager.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mk_manager"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".testenv", ".test_libs"]

[tool.ruff.lint]
select = ["E9", "F"]  # erros de sintaxe e pyflakes: o mínimo que pega bug real sem reformatar o projeto
